name: Build v2rayN 4.20 XP (.NET Framework 4.0)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install .NET Framework 4.0 reference assemblies
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -Version 1.0.3 -OutputDirectory packages
          if ($LASTEXITCODE -ne 0) { throw "Failed to install .NET Framework 4.0 reference assemblies" }

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          msbuild "v2rayN/v2rayN/v2rayN.csproj" /t:Restore /p:RestoreIgnoreFailedSources=true
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed" }

      - name: Build .NET Framework 4.0 solution
        shell: pwsh
        run: |
          $frameworkRoot = (Resolve-Path "packages/Microsoft.NETFramework.ReferenceAssemblies.net40.1.0.3/build").Path
          msbuild "v2rayN/v2rayN/v2rayN.csproj" /m /p:Configuration=Release /p:Platform=AnyCPU /p:TargetFrameworkRootPath="$frameworkRoot" /v:minimal
          if ($LASTEXITCODE -ne 0) { throw ".NET Framework 4.0 build failed" }

      - name: Upload GUI build
        uses: actions/upload-artifact@v4
        with:
          name: v2rayN-4.20-XP-net40
          path: |
            v2rayN/v2rayN/bin/Release/**
          if-no-files-found: error
          retention-days: 14
